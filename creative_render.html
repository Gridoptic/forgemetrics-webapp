<!doctype html><html><head><meta charset="utf-8">__FONTS__
<style>
  html,body{margin:0;padding:0;background:transparent;width:1080px;height:1920px;overflow:hidden}
  #scene{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Inter','DejaVu Sans',sans-serif;color:var(--ink)}
  #scene.solid{background:var(--bg)}
  .glow{position:absolute;border-radius:50%;filter:blur(120px);opacity:.55;will-change:transform}
  .g1{width:900px;height:900px;background:var(--acc)}
  .g2{width:760px;height:760px;background:var(--acc2)}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:96px 96px;mask-image:radial-gradient(circle at 50% 45%,#000 30%,transparent 78%);-webkit-mask-image:radial-gradient(circle at 50% 45%,#000 30%,transparent 78%)}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.52) 0%,rgba(0,0,0,.22) 22%,rgba(0,0,0,.18) 48%,rgba(0,0,0,.38) 70%,rgba(0,0,0,.78) 100%)}
  #scene.left .scrim{background:linear-gradient(180deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,.10) 30%,rgba(0,0,0,.30) 55%,rgba(0,0,0,.86) 100%)}
  #scene.solid .scrim{background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.18) 100%)}
  .kicker{position:absolute;left:84px;right:160px;top:250px;font-size:34px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);display:flex;align-items:center;gap:16px;text-shadow:0 2px 14px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden}
  .kicker i{display:inline-block;width:52px;height:4px;border-radius:2px;background:var(--acc);flex:0 0 auto}
  .kicker span{overflow:hidden;text-overflow:ellipsis}
  .tag{position:absolute;left:84px;right:160px;top:230px;display:flex;align-items:flex-end;gap:26px;text-shadow:0 4px 18px rgba(0,0,0,.7)}
  .tag .n{font-size:150px;font-weight:800;line-height:.9;letter-spacing:-.05em;color:var(--acc2);font-variant-numeric:tabular-nums}
  .tag .l{font-size:38px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);padding-bottom:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag .l::before{content:"";display:block;width:64px;height:5px;border-radius:3px;background:var(--acc2);margin-bottom:18px}
  .main{position:absolute;left:84px;right:160px;top:50%;transform:translateY(-52%);font-weight:800;line-height:1.06;letter-spacing:-.02em;text-shadow:0 4px 18px rgba(0,0,0,.7),0 12px 60px rgba(0,0,0,.55)}
  .main.low{top:auto;bottom:560px;transform:none;text-align:left}
  .main.cta{top:27%;transform:none}
  .w{display:inline-block;margin-right:.26em;white-space:nowrap}
  .w.wl{white-space:normal;margin-right:0}
  .card,.proof,.pc,.num small,.cinesub,.take .t{overflow-wrap:anywhere}
  .addr{position:absolute;left:60px;right:60px;top:50%;text-align:center;font-size:96px;font-weight:800;line-height:1.05;letter-spacing:-.01em;color:#fff;white-space:nowrap;text-shadow:0 6px 30px rgba(0,0,0,.75),0 0 3px rgba(0,0,0,.9)}
  
  .num{position:absolute;left:84px;right:160px;top:42%;transform:translateY(-50%);font-size:250px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--acc2);text-shadow:0 10px 60px rgba(0,0,0,.5);font-variant-numeric:tabular-nums;max-height:620px}
  .num small{display:block;font-size:56px;font-weight:700;color:var(--ink);letter-spacing:-.01em;margin-top:20px;line-height:1.18}
  .pair{position:absolute;left:84px;right:160px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:30px}
  .pc{padding:44px 48px;border-radius:34px;font-size:58px;font-weight:700;line-height:1.24;letter-spacing:-.01em}
  .pc small{display:block;font-size:28px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:16px}
  .pc.myth{background:rgba(10,13,24,.62);border:2px solid rgba(255,255,255,.14);color:#b9bfd2;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .pc.myth small{color:var(--mut)}
  .pc.myth .t{text-decoration:line-through;text-decoration-thickness:4px;text-decoration-color:rgba(255,255,255,.35)}
  .pc.fact{background:rgba(10,13,24,.74);border:3px solid var(--acc);color:var(--ink);box-shadow:0 30px 90px -30px rgba(0,0,0,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .pc.fact small{color:var(--acc)}
  .take{position:absolute;left:84px;right:160px;top:50%;transform:translateY(-50%);padding:58px 56px;border-radius:40px;background:rgba(10,13,24,.72);border:2px solid rgba(255,255,255,.10);border-left:16px solid var(--acc2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 30px 90px -30px rgba(0,0,0,.8)}
  .take small{display:block;font-size:30px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--acc2);margin-bottom:22px}
  .take .t{font-size:72px;font-weight:800;line-height:1.14;letter-spacing:-.02em;color:var(--ink)}
  .card{position:absolute;left:84px;right:160px;bottom:530px;padding:38px 42px;border-radius:32px;background:rgba(10,13,24,.62);border:2px solid rgba(255,255,255,.10);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);font-size:48px;font-weight:600;line-height:1.28;color:var(--ink)}
  .card b{color:var(--acc)}
  .card .tg{display:inline-flex;align-items:center;gap:12px;margin-bottom:18px;padding:10px 20px 10px 14px;border-radius:99px;background:#229ED9;color:#fff;font-size:30px;font-weight:700;letter-spacing:.02em}
  .card .tg svg{width:34px;height:34px;display:block}
  .card .ct{display:block}
  .brand{position:absolute;left:84px;right:160px;bottom:400px;display:flex;align-items:center;gap:22px}
  .brand .av{width:92px;height:92px;border-radius:26px;overflow:hidden;background:linear-gradient(135deg,#2a3350,#171d30);display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;color:#aeb6cf;border:2px solid rgba(255,255,255,.14);flex:0 0 auto;box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .brand .av img{width:100%;height:100%;object-fit:cover;display:block}
  .brand .nm{font-size:40px;font-weight:700;color:var(--ink);text-shadow:0 4px 24px rgba(0,0,0,.5);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brand .nm small{display:block;font-size:28px;font-weight:500;color:var(--mut);margin-top:2px}
  .proof{position:absolute;left:84px;right:160px;bottom:300px;font-size:26px;font-weight:500;
    letter-spacing:.04em;color:var(--mut);display:flex;align-items:center;gap:12px;
    text-shadow:0 2px 12px rgba(0,0,0,.85)}
  .proof i{font-style:normal;width:8px;height:8px;border-radius:50%;background:var(--acc);flex:0 0 auto}
  #scene.th-e .proof{justify-content:center;left:150px;right:190px;bottom:280px}
  .cinesub{position:absolute;left:96px;right:96px;bottom:300px;text-align:center;font-size:66px;
    font-weight:800;letter-spacing:-.01em;line-height:1.2;color:#fff;
    text-shadow:0 3px 0 rgba(0,0,0,.55),0 6px 26px rgba(0,0,0,.95),0 0 60px rgba(0,0,0,.8);
    -webkit-text-stroke:2px rgba(0,0,0,.35)}
  #scene.subsonly .tag,#scene.subsonly .main,#scene.subsonly .take,#scene.subsonly .pair{display:none}
  #scene.subsonly .scrim{background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,.06) 30%,rgba(0,0,0,.22) 58%,rgba(0,0,0,.72) 100%)}
  #scene.cine .kicker{display:none}
  #scene.cine .scrim{background:linear-gradient(180deg,rgba(0,0,0,.30) 0%,rgba(0,0,0,.08) 35%,rgba(0,0,0,.16) 62%,rgba(0,0,0,.66) 100%)}
  #scene.cine.bright.bright .scrim{background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.38) 35%,rgba(0,0,0,.44) 62%,rgba(0,0,0,.82) 100%)}
  #scene.cine.bright.bright .cinesub{text-shadow:0 3px 20px rgba(0,0,0,.95),0 10px 60px rgba(0,0,0,.85)}
  .anim{opacity:0}
  /* ЧЕТЫРЕ ВИЗУАЛЬНЫЕ ТЕМЫ. Тема закреплена за каналом: ролики разных каналов и ниш
     не должны быть узнаваемы как «сделано одной программой». */

  /* A · журнал: без плашек, огромная типографика, номер словом-ярлыком */
  #scene.th-a .tag{align-items:baseline;gap:18px}
  #scene.th-a .tag .n{display:none}
  #scene.th-a .tag .l{font-size:34px;letter-spacing:.2em;color:var(--acc)}
  #scene.th-a .tag .l::before{width:120px;height:3px;background:var(--acc);margin-bottom:14px}
  #scene.th-a .main{letter-spacing:-.035em;line-height:.98}
  #scene.th-a .main.low{bottom:600px}
  #scene.th-a .take{background:transparent;border:0;border-left:0;padding:0 0 0 34px;box-shadow:none;
    border-left:8px solid var(--acc);backdrop-filter:none;-webkit-backdrop-filter:none}
  #scene.th-a .take small{color:var(--acc);letter-spacing:.28em}
  #scene.th-a .num{letter-spacing:-.06em}
  #scene.th-a .num small{font-weight:600;color:var(--mut)}
  #scene.th-a .kicker{letter-spacing:.34em;font-size:28px;font-weight:600}
  #scene.th-a .kicker i{display:none}
  #scene.th-a .pc{border-radius:0;border-width:0 0 0 10px;background:rgba(10,13,24,.55)}

  /* B · терминал: моно-цифры, тонкие рамки, номер как 01/02 в рамке */
  #scene.th-b .tag .n{font-size:96px;border:4px solid var(--acc);border-radius:0;padding:6px 18px;line-height:1;color:var(--acc)}
  #scene.th-b .tag .l{font-size:32px;letter-spacing:.24em;color:var(--mut)}
  #scene.th-b .tag .l::before{display:none}
  #scene.th-b .main{font-weight:750;letter-spacing:-.01em}
  #scene.th-b .main.low{bottom:600px}
  #scene.th-b .take{border-radius:0;border:2px solid var(--acc2);border-left-width:2px;background:rgba(6,8,15,.82)}
  #scene.th-b .take small{letter-spacing:.3em}
  #scene.th-b .num{color:var(--ink)}
  #scene.th-b .num small{color:var(--acc2);text-transform:uppercase;letter-spacing:.12em;font-size:44px}
  #scene.th-b .kicker{font-size:30px;letter-spacing:.3em}
  #scene.th-b .kicker i{width:16px;height:16px;border-radius:0;background:var(--acc2)}
  #scene.th-b .pc{border-radius:8px}
  #scene.th-b .card{border-radius:10px;border-color:var(--acc)}

  /* C · тёплый разворот: мягкие карточки, номер точкой, текст ниже центра */
  #scene.th-c .tag{align-items:center;gap:16px}
  #scene.th-c .tag .n{font-size:0;width:26px;height:26px;border-radius:50%;background:var(--acc2)}
  #scene.th-c .tag .l{font-size:36px;letter-spacing:.06em;text-transform:none;padding-bottom:0}
  #scene.th-c .tag .l::before{display:none}
  #scene.th-c .main{top:auto;bottom:620px;transform:none;line-height:1.12;letter-spacing:-.01em;font-weight:750}
  #scene.th-c .take{border-radius:52px;border-left:0;border:2px solid rgba(255,255,255,.14);text-align:center}
  #scene.th-c .take small{color:var(--acc2)}
  #scene.th-c .num{text-align:center;left:84px;right:120px}
  #scene.th-c .num small{margin-top:26px}
  #scene.th-c .kicker{justify-content:center;left:84px;right:120px;letter-spacing:.18em}
  #scene.th-c .pc{border-radius:44px}
  #scene.th-c .card{border-radius:44px}

  /* D · минимал: только слово и воздух, ярлык под текстом, никаких рамок */
  #scene.th-d .tag{top:auto;bottom:520px;align-items:center;gap:14px}
  #scene.th-d .tag .n{font-size:54px;color:var(--mut);opacity:.7}
  #scene.th-d .tag .l{font-size:30px;letter-spacing:.24em;color:var(--mut)}
  #scene.th-d .tag .l::before{display:none}
  #scene.th-d .main{top:44%;letter-spacing:-.04em;line-height:1.0}
  #scene.th-d .main.low{top:auto;bottom:640px}
  #scene.th-d .take{background:transparent;border:0;padding:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
  #scene.th-d .take small{color:var(--acc);letter-spacing:.32em;margin-bottom:26px}
  #scene.th-d .take .t{font-weight:800}
  #scene.th-d .num small{color:var(--ink);opacity:.85}
  #scene.th-d .kicker{font-size:26px;letter-spacing:.4em;opacity:.85}
  #scene.th-d .kicker i{width:28px}
  #scene.th-d .card{background:rgba(10,13,24,.5);border-radius:26px}

  /* E · кино-субтитры: только речь по центру тонким шрифтом, без плашек, номеров и ярлыков.
     Кадр держит видеоряд, текст лишь помогает — как в живых Shorts. */
  #scene.th-e .tag,#scene.th-e .kicker{display:none}
  #scene.th-e .main{top:50%;left:150px;right:190px;transform:translateY(-50%);text-align:center;
    font-weight:500;letter-spacing:0;line-height:1.32;text-shadow:0 2px 18px rgba(0,0,0,.85),0 0 60px rgba(0,0,0,.6)}
  #scene.th-e .main.low{top:50%;bottom:auto;transform:translateY(-50%);text-align:center}
  #scene.th-e .main .w{margin-right:.24em}
  #scene.th-e .take{background:transparent;border:0;padding:0;box-shadow:none;backdrop-filter:none;
    -webkit-backdrop-filter:none;text-align:center;left:150px;right:190px}
  #scene.th-e .take small{display:none}
  #scene.th-e .take .t{font-weight:600;line-height:1.3;text-shadow:0 2px 18px rgba(0,0,0,.85)}
  #scene.th-e .num{text-align:center;left:130px;right:170px;font-weight:700}
  #scene.th-e .num small{font-weight:500;font-size:46px;color:var(--ink);opacity:.92}
  #scene.th-e .pc{background:rgba(0,0,0,.42);border:0;border-radius:22px;font-weight:500;text-align:center}
  #scene.th-e .pc small{opacity:.8}
  #scene.th-e .brand{display:none}
  #scene.th-e.fin .brand{display:flex}
  #scene.th-e .card{background:rgba(0,0,0,.55);border-color:rgba(255,255,255,.16);font-weight:500}
  #scene.th-e .scrim{background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,.30) 40%,rgba(0,0,0,.42) 100%)}

  /* кадр «в рамке»: план занимает середину, текст уходит под него — ничего не перекрывается */
  #scene.lb .main{top:auto;bottom:560px;transform:none}
  #scene.lb .main.low{bottom:560px}
  #scene.lb .take{top:auto;bottom:540px;transform:none}
  #scene.lb .pair{top:auto;bottom:540px;transform:none}
  #scene.lb .num{top:auto;bottom:560px;transform:none}
  #scene.lb .scrim{background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.10) 26%,rgba(0,0,0,.10) 56%,rgba(0,0,0,.72) 78%,rgba(0,0,0,.9) 100%)}

  /* кадр с научной схемой: она занимает верх кадра, поэтому текст всегда внизу —
     иначе тема (например, кино-субтитры) центрирует его прямо поверх схемы */
  #scene.own.own .main{top:auto;bottom:566px;transform:none}
  /* схема подписана изнутри (АКТИН, МИОЗИН), поэтому метка пункта тут только спорит
     с заголовком за место */
  #scene.own.own .tag{display:none}
  #scene.own.own .num{top:auto;bottom:566px;transform:none}
  #scene.own.own .pair,#scene.own.own .take{top:auto;bottom:566px;transform:none}
  #scene.own.own .scrim{background:linear-gradient(180deg,rgba(0,0,0,.30) 0%,rgba(0,0,0,.05) 34%,
    rgba(0,0,0,.35) 66%,rgba(0,0,0,.82) 100%)}

  /* в минимализме метка пункта стоит под заголовком: в кадре с рамкой заголовок
     опускается и садится на неё — поднимаем его выше метки */
  #scene.th-d.lb .main{bottom:632px}

  /* финальный кадр: под заголовком стоят карточка (530px) и подпись канала (400px),
     поэтому заголовок держим в верхней трети во ВСЕХ темах — иначе тема сдвигает его
     в центр и текст ложится на карточку */
  #scene.th-a .main.cta,#scene.th-b .main.cta,#scene.th-c .main.cta,#scene.th-d .main.cta,
  #scene.th-e .main.cta,#scene.lb .main.cta{top:24%;bottom:auto;transform:none}

  /* светлый план: затемнение и тени обязаны перебивать настройки темы, иначе белый
     текст ложится на светлую траву и не читается — отсюда двойной класс */
  #scene.bright.bright .scrim{background:linear-gradient(180deg,rgba(0,0,0,.68) 0%,rgba(0,0,0,.56) 30%,
    rgba(0,0,0,.58) 60%,rgba(0,0,0,.88) 100%)}
  #scene.bright.bright .main,#scene.bright.bright .num,#scene.bright.bright .tag,
  #scene.bright.bright .take .t,#scene.bright.bright .proof,#scene.bright.bright .pc{
    text-shadow:0 4px 22px rgba(0,0,0,.95),0 14px 70px rgba(0,0,0,.85)}

  /* акценты кадра внутри темы: чередование от сцены к сцене */
  #scene.v1 .main{text-align:left}
  #scene.v1 .num{top:38%}
  #scene.v2 .main.low{bottom:700px}
  #scene.v2 .kicker{top:210px}
  #scene.rec.rec.rec .scrim{background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,0) 64%,rgba(0,0,0,.6) 100%)}
  #scene.rec.rec.rec .main,#scene.rec.rec.rec .main.low{top:1380px;bottom:auto;left:60px;right:60px;transform:none;text-align:center}
  #scene.hook0.hook0.hook0.cine .main{top:230px;bottom:auto;left:60px;right:60px;transform:none;text-align:center}
  #scene.hasaddr.hasaddr.hasaddr .main.cta{top:auto;bottom:1040px;left:60px;right:60px;transform:none;text-align:center}
  .logo{position:absolute;left:160px;top:520px;width:760px;height:760px;display:flex;align-items:center;justify-content:center}
  .logo img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 18px 60px rgba(0,0,0,.55))}
  #scene.haslogo.haslogo.haslogo .scrim{background:radial-gradient(circle at 50% 47%,rgba(20,48,46,.93),rgba(7,10,19,.97) 64%)}
  #scene.haslogo.haslogo.haslogo .main.cta{top:200px;bottom:auto;left:60px;right:60px;transform:none;text-align:center}
  #scene.haslogo.haslogo.haslogo .addr{top:1330px;color:#5DCAA5}
  .addr .al{display:block}
  .anote{position:absolute;left:60px;right:60px;top:1500px;text-align:center;font-size:46px;font-weight:600;line-height:1.2;color:rgba(255,255,255,.82);overflow-wrap:anywhere;text-shadow:0 4px 20px rgba(0,0,0,.7)}
</style></head><body><div id="scene"></div>
<script>
(function () {
  var S = null;
  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fitSize(words, maxW) {
    var n = words.join(' ').length, longest = Math.max.apply(null, words.map(function (w) { return w.length; }));
    var size = n <= 18 ? 132 : n <= 30 ? 118 : n <= 44 ? 102 : n <= 60 ? 90 : 78;
    if (longest > 10) size = Math.min(size, Math.floor(maxW / (longest * 0.62)));
    return size;
  }
  function numSize(s, maxW) {
    var t = String(s || '').trim();
    if (!t) return 250;
    var words = t.split(/[\s\u00a0]+/).filter(Boolean);
    var longest = words.length ? Math.max.apply(null, words.map(function (w) { return w.length; })) : t.length;
    t.split(/\s/).forEach(function (chunk) {
      if (chunk.indexOf('\u00a0') >= 0) longest = Math.max(longest, chunk.length);
    });
    // короткое число с единицей должно стоять одной строкой: меряем по всей длине
    var by = t.length <= 12 ? Math.max(t.length, longest) : longest;
    return Math.max(100, Math.min(250, Math.floor(maxW / (by * 0.62))));
  }
  function pairSize(t) {
    var n = String(t || '').length;
    return n <= 34 ? 58 : n <= 50 ? 50 : 44;
  }
  var MOTION = {
    words: {k: 'rise', step: 0.07},   // слова по одному снизу
    line: {k: 'fade', step: 0},       // фраза целиком, мягким проявлением
    slide: {k: 'slide', step: 0.05},  // слова выезжают сбоку
    zoom: {k: 'zoom', step: 0.04}     // фраза с лёгким наездом
  };
  function motionOf() {
